<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f8fa">
    <title>发到稍后读 · InfoFlowHub</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%230969da'/><text x='8' y='12' font-size='10' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>F</text></svg>">
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="quick-shell" id="main-content">
      <header class="quick-head">
        <a class="quick-back" href="/" aria-label="回到 InfoFlowHub 主页">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <div class="quick-heading">
          <h1>发到稍后读</h1>
          <p>粘贴链接，或写下想稍后读的内容</p>
        </div>
      </header>

      <form class="quick-form" id="quick-form" novalidate>
        <label class="quick-label" for="quick-input">链接或文字</label>
        <textarea
          class="quick-input"
          id="quick-input"
          name="content"
          rows="8"
          placeholder="例如：https://example.com/article&#10;或者一段想存下来的话…"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          enterkeyhint="enter"
        ></textarea>
        <div class="quick-meta">
          <div class="quick-meta-left">
            <input class="quick-file" id="quick-image" type="file" accept="image/*" multiple>
            <label class="quick-photo" id="quick-photo" for="quick-image">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
              图片
            </label>
            <span class="quick-kind" id="quick-kind" data-kind="empty">等待输入</span>
          </div>
          <span class="quick-count" id="quick-count">0 字</span>
        </div>
        <button class="quick-submit" id="quick-submit" type="submit">发到稍后读</button>
        <p class="quick-status" id="quick-status" role="status" aria-live="polite"></p>
      </form>

      <section class="quick-recent" id="quick-recent" hidden aria-labelledby="quick-recent-title">
        <h2 id="quick-recent-title">最近发送</h2>
        <ul id="quick-recent-list"></ul>
      </section>

      <p class="quick-hint">标签由每天 8:10 的自动流程统一生成</p>
    </main>

    <script>
      (() => {
        "use strict";

        const form = document.getElementById("quick-form");
        const input = document.getElementById("quick-input");
        const submit = document.getElementById("quick-submit");
        const statusEl = document.getElementById("quick-status");
        const kindEl = document.getElementById("quick-kind");
        const countEl = document.getElementById("quick-count");
        const recent = document.getElementById("quick-recent");
        const recentList = document.getElementById("quick-recent-list");
        const imageInput = document.getElementById("quick-image");
        const photoLabel = document.getElementById("quick-photo");

        const MAX_LEN = {{ max_chars }};
        const HISTORY_KEY = "infoflowhub:quick-sent:v1";
        // 整段只有单个 URL 才算链接；带空格或换行的内容一律当文字，
        // 避免把「链接 + 说明」误判成链接后丢掉说明。
        const LINK_RE = /^https?:\/\/\S+$/i;
        const KIND_TEXT = { empty: "等待输入", link: "识别为链接", text: "识别为文字" };
        const KIND_LABEL = { link: "链接", text: "文字", image: "图片" };

        let sending = false;
        let statusTimer = 0;

        function classify(value) {
          const text = value.trim();
          if (!text) return "empty";
          return LINK_RE.test(text) ? "link" : "text";
        }

        function updateMeta() {
          const kind = classify(input.value);
          const length = input.value.trim().length;
          kindEl.dataset.kind = kind;
          kindEl.textContent = KIND_TEXT[kind];
          countEl.textContent = `${length} 字`;
          countEl.dataset.over = length > MAX_LEN ? "1" : "";
        }

        function setStatus(message, tone) {
          window.clearTimeout(statusTimer);
          statusEl.textContent = message;
          statusEl.dataset.tone = tone || "";
          if (tone === "ok") {
            statusTimer = window.setTimeout(() => {
              statusEl.textContent = "";
              statusEl.dataset.tone = "";
            }, 3600);
          }
        }

        function readHistory() {
          try {
            const list = JSON.parse(window.localStorage.getItem(HISTORY_KEY) || "[]");
            return Array.isArray(list) ? list : [];
          } catch {
            return [];
          }
        }

        function writeHistory(list) {
          try {
            window.localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, 20)));
          } catch {
            /* 隐私模式写不进去只影响「最近发送」，收录本身不受影响 */
          }
        }

        function formatTime(timestamp) {
          try {
            return new Intl.DateTimeFormat("zh-CN", { hour: "2-digit", minute: "2-digit" }).format(new Date(timestamp));
          } catch {
            return "";
          }
        }

        function renderHistory() {
          const list = readHistory().slice(0, 5);
          recent.hidden = list.length === 0;
          const items = list.map((entry) => {
            const li = document.createElement("li");
            li.className = "quick-recent-item";

            const badge = document.createElement("span");
            badge.className = "quick-recent-badge";
            badge.textContent = KIND_LABEL[entry.kind] || "条目";

            const body = entry.url ? document.createElement("a") : document.createElement("span");
            body.className = "quick-recent-text";
            body.textContent = entry.text;
            if (entry.url) {
              body.href = entry.url;
              body.target = "_blank";
              body.rel = "noreferrer";
            } else {
              body.title = entry.text;
            }

            const time = document.createElement("time");
            time.className = "quick-recent-time";
            time.textContent = formatTime(entry.at);

            li.append(badge, body, time);
            return li;
          });
          recentList.replaceChildren(...items);
        }

        async function send() {
          if (sending) return;
          const value = input.value.trim();
          if (!value) {
            setStatus("先输入链接或文字", "error");
            input.focus();
            return;
          }
          if (value.length > MAX_LEN) {
            setStatus(`文字超长：${value.length} / ${MAX_LEN} 字`, "error");
            input.focus();
            return;
          }

          const kind = classify(value);
          const payload = kind === "link" ? { url: value, title: value } : { text: value };
          sending = true;
          submit.disabled = true;
          submit.textContent = "发送中…";
          setStatus("", "");

          try {
            const response = await fetch("/actions/laterhub/add-link", {
              method: "POST",
              credentials: "same-origin",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
            let data = {};
            try {
              data = await response.json();
            } catch {
              /* 非 JSON 错误体：交给下面的失败分支 */
            }
            if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);

            input.value = "";
            updateMeta();
            form.classList.add("is-sent");
            window.setTimeout(() => form.classList.remove("is-sent"), 1100);
            setStatus(data.duplicated ? "已在稍后读中（重复收录）" : "已收进稍后读", "ok");
            writeHistory([
              { kind, text: value, url: kind === "link" ? value : "", at: Date.now() },
              ...readHistory(),
            ]);
            renderHistory();
            input.focus();
          } catch (error) {
            // fetch 的网络错误是 TypeError（Failed to fetch），对用户没有信息量，换成可执行的下一步
            const reason =
              error instanceof TypeError ? "连不上服务器，检查 Tailscale 或服务状态" : error.message;
            setStatus(`发送失败：${reason}。内容已保留，可直接重试。`, "error");
          } finally {
            sending = false;
            submit.disabled = false;
            submit.textContent = "发到稍后读";
          }
        }

        async function uploadImage(file) {
          setStatus("正在发送图片…", "");
          const payload = new FormData();
          payload.append("image", file);
          try {
            const response = await fetch("/actions/laterhub/add-image", {
              method: "POST",
              credentials: "same-origin",
              body: payload,
            });
            let data = {};
            try {
              data = await response.json();
            } catch {
              /* 非 JSON 错误体：交给失败分支 */
            }
            if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);

            setStatus("已收进稍后读（图片）", "ok");
            writeHistory([
              { kind: "image", text: data.title, url: data.url, at: Date.now() },
              ...readHistory(),
            ]);
            renderHistory();
          } catch (error) {
            const reason =
              error instanceof TypeError ? "连不上服务器，检查 Tailscale 或服务状态" : error.message;
            setStatus(`图片发送失败：${reason}。请重新选择。`, "error");
          }
        }

        async function onImagesChosen() {
          const files = Array.from(imageInput.files || []);
          // 先清空 value：同一张图再次选择也要触发 change
          imageInput.value = "";
          for (const file of files) {
            await uploadImage(file);
          }
        }

        input.addEventListener("input", updateMeta);
        imageInput.addEventListener("change", onImagesChosen);
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          send();
        });
        input.addEventListener("keydown", (event) => {
          if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
            event.preventDefault();
            send();
          }
        });

        updateMeta();
        renderHistory();
      })();
    </script>
  </body>
</html>
