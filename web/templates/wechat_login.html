{% extends "base.html" %}

{% block title %}微信读书扫码登录{% endblock %}

{% block body %}
<div class="shell">
  <main class="main">
    <section class="card" style="max-width: 520px; margin: 40px auto;">
      <div class="panel-title">
        <h3>微信读书扫码登录</h3>
      </div>
      <p class="subtle" style="margin-bottom: 16px;">用手机微信扫描下方二维码，登录微信读书采集账号（用于抓取公众号文章标题/链接）。登录态约 4 天过期，过期后需重新扫码。⚠️ 扫码时请勿勾选「24 小时后自动退出」。</p>
      <div id="wechat-login-app" data-wechat-login data-next-url="{{ next_url or '/?view=settings' }}">
        <div class="wechat-login-box">
          <div class="wechat-login-qr" id="wechat-login-qr">正在准备二维码...</div>
          <p class="wechat-login-status" id="wechat-login-status">初始化中...</p>
          <div class="wechat-login-actions">
            <button class="btn" type="button" id="wechat-login-refresh">刷新二维码</button>
            <a class="btn ghost" href="{{ next_url or '/?view=settings' }}">返回</a>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
{% endblock %}
