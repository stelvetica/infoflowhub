                      - paragraph [ref=f1e409]: "怎么玩转美债 一天赚40亿美元【别看热闹，看钱2】 【别看热闹，看钱2】 39万亿美债是个巨型金融炸弹，不拆除它极度危险，但更危险的是，拆除它。 如果不拆除，未来某一天，它可能会把资本市场炸回到骑着毛驴赶集的年代。 如果拆除它，它现在立刻马上就会把资本市场和那只毛驴一起炸到火星上。 所以美国必须接着发新债，如果胆敢不继续，那么，全球流动性就会枯竭，资本主义就会立刻安排后事，吹拉弹唱，请大家再看一次加强版的08次贷危机。 是的，39万亿美债确实可能让美国垮掉，也可能让全世界垮掉，但不是用大多数人以为的那种方式。 信源列表： 美债规模、债务/GDP、利息负担 美国财政部债务数据 CBO 或财政部年度报告对利息支出的统计 美债在回购市场中的抵押品地位 美国金融研究办公室（OFR）关于美国回购市场结构的工作论文 BIS/FSB 关于\"collateral reuse\"和\"safe assets\"的章节 ECB/BIS 讨论全球抵押品池的论文 美国回购市场日均成交约 12–13 万亿美元 OFR 2025年关于 US Repo Market 的测算报告 美联储研究员的 FEDS Notes（$12 Trillion US Repo Market 那篇） 基差交易、开曼群岛对冲基金、1.85 万亿与 37% 美联储研究报告《The Cross-Border Trail of the Treasury Basis Trade》 国债现券–期货基差交易规模约 1.5 万亿美元 CFTC / 芝加哥联储/达拉斯联储关于 Treasury basis trade 的专题研究 美债买家排行 美国财政部 TIC 数据（Top Foreign Holders of U.S. Treasury Securities）。 250 万亿资产池 FSB 年度《Global Monitoring Report on Non‑Bank Financial Intermediation》 衍生品 846 万亿名义金额 BIS Quarterly Review 中的全球 OTC derivatives 统计表 AIG 与 CDS 美国政府问责局（GAO） 美联储/财政部报告 德债、JGB 作为竞争性抵押品 德国联邦财政部公告 日本央行（BoJ）的货币政策会议纪要 #燃起来了大国重器#零距离看懂财经#美债"
