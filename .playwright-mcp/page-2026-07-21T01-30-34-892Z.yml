                  - listitem [ref=f1e424]:
                    - link [ref=f1e426] [cursor=pointer]:
                      - /url: /video/7638146999908306216
                      - generic [ref=f1e427]:
                        - 'img "破壁狗：阿根廷赌局：为什么这个国家总是想自杀？ 【国家赌场4】2023年，被绝望的阿根廷人选为总统的米莱，是经济学家出身，芝加哥学派的忠实信徒，芝加哥学派的主张，简单归结就是，政府越小越好，最好小到可以溺死在浴缸里。 另一个芝加哥学派的忠实信徒，美国总统里根说过一句话，他说，英语里最可怕的九个单词是，我是政府派来帮你的。（I''m / from / the / Government / and / I''m / here / to / help） 所以，米莱的基本执政观点是，政府印钱是万恶之源，基本执政思路是，货币紧缩，不让政府印钱，抽掉那个自我毁灭体系的根基，而没有钱的政府，什么也做不了。 米莱会成功吗？阿根廷经济能跳出这个体系吗？ 部分信源列表 国际货币基金组织 (IMF) 阿根廷与英国的人均GDP对比（名义与PPP口径） 世界银行 (World Bank) 阿根廷贫困率及2026年经济复苏预测。 CEIC Data（全球宏观经济数据库） 阿根廷截至2025年底的公共债务总额（4551亿美元）及占GDP比重（78.4%）。 阿根廷2026年月度通胀率（降至3%左右）及历史恶性通胀曲线。 美国国家经济研究局 (NBER) “阿根廷人对美元上瘾是神经性条件反射”的学术定性，以及梅内姆1:1汇率绑定的历史教训。 《金融时报》 (Financial Times) 阿根廷民间持有超2500亿美元现金的规模，以及米莱“电锯改革”在2026年的最新进展与代价。 #燃起来了大国重器 #零距离看懂财经 #阿根廷经济 #破壁大狗" [ref=f1e430]'
